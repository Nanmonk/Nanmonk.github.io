baseURL = 'https://blog.nanmonk.site/'
locale = 'zh-cn'
title = "Nanmonk's Blog"
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  title = "Nanmonk's Blog"
  description = ""
  author = "Nanmonk"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

[params.homeInfoParams]
  Title = "Hi, I'm Nanmonk"
  Content = ""

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Nanmonk"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 2

[markup.goldmark.extensions]
  alerts = true

[markup.highlight]
  noClasses = false
